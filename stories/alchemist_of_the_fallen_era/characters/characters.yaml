# Characters Dossier: The Omnicrafter of the Fallen Era

characters:
  - id: "char-001"
    name: "Arthur Vance"
    role: "Protagonist / The Omnicrafter"
    age: 23
    gender: "Male"
    tier: "Novice Early -> Novice Peak (Arc 1)"
    personality_traits:
      - "Quietly brilliant, encyclopedic recall of every book he ever cataloged"
      - "Deep down craves recognition, praise, and respect ('I just want someone to notice I built this!')"
      - "Perpetually cursed by comedic timing: just as he saves the day, he slips, is out of frame, or a runaway rat knocks over a pipe, and someone else gets the credit"
      - "Clinical, lethal, and calculating when the fighting starts; never fights fair against stronger enemies"
    driving_want: "Heal Eleanor, secure Blackwood Bunker, and finally receive legitimate credit as a capable hero."
    core_fear: "Failing Eleanor, and forever being dismissed as a useless floor-sweeper."
    voice_profile:
      sentence_cadence: "Polite, modest, slightly exasperated when people thank the wrong person, ruthlessly analytical during combat"
      formality_level: 0.6
      verbal_tics:
        - "According to the 1894 monograph on biomechanics..."
        - "Wait, no! That wasn't the rat, that was my pressurized nitro-glycol trap—never mind..."
    current_location: "Grand Municipal Library (Chapter 1)"
    equipped_items:
      - "item-001" # Torn Codex Leaf
      - "item-002" # High-Carbon Surgical Kit
      - "item-005" # The Chimera Frame (Modular Combat Platform Mark I)

  - id: "char-002"
    name: "Eleanor Vance"
    role: "Protagonist's Younger Sister"
    age: 15
    gender: "Female"
    tier: "Mortal (Latent Sovereign Vessel)"
    personality_traits:
      - "Perceptive, witty, fiercely supportive of Arthur"
      - "The ONLY person who actually knows Arthur did all the crazy combat feats"
      - "Frequently tries to correct people ('Arthur did that!'), but bystanders just think she's being a cute, adoring little sister"
    driving_want: "Survive her fever, support Arthur's engineering work, and make sure he gets the credit he deserves."
    core_fear: "Succumbing to the primordial resonance before Arthur finishes his cure."
    current_location: "St. Jude Central Clinic, Isolation Ward 4"

  - id: "char-003"
    name: "Dr. Nicholas Ward"
    role: "Senior Pharmacologist & Clinic Leader"
    age: 58
    gender: "Male"
    tier: "Mortal"
    personality_traits:
      - "Gruff, pragmatic doctor who respects empirical results"
      - "Constantly bewildered by how 'coincidences' keep saving the hospital from mutant beasts"
    driving_want: "Preserve medical supplies and keep the quarantine patients alive."
    current_location: "St. Jude Central Clinic"

  - id: "char-004"
    name: "Marcus Cole ('Ironfang')"
    role: "Primary Warlord Antagonist of Arc 1"
    age: 34
    gender: "Male"
    tier: "Intermediate Peak (Feral Beast Graft)"
    personality_traits:
      - "Brutal, arrogant tyrant who believes brute mutant strength is the only law"
      - "Terrified of an unknown phantom ('The Ghost Artificer') who is assassinating his lieutenants with impossible weapons"
    driving_want: "Control the northern highway depot and crush all resistance."
    current_location: "Northside Logistics Depot"

  - id: "char-005"
    name: "Vera Bennett"
    role: "Ex-Military Scout / Convoy Protector"
    age: 27
    gender: "Female"
    tier: "Intermediate Early (Reflex Awakening)"
    personality_traits:
      - "Tough, no-nonsense tactical soldier"
      - "Often accidentally ends up in the heroic pose right as Arthur's traps go off, causing survivors to hail HER as the savior (to her utter confusion)"
    driving_want: "Safely escort the convoy to Blackwood Ridge Bunker."
    current_location: "Metropolitan Police Auxiliary Barracks"

  - id: "char-006"
    name: "Barnaby the Camp Rat"
    role: "Accidental Hero & Running Gag"
    age: 1
    gender: "Male"
    tier: "Mortal Rodent"
    personality_traits:
      - "A scruffy gray sewer rat that follows the smell of Arthur's alchemical dried berries"
      - "Once scurried across a detonator wire, blowing up a charging mutant hound just as Arthur was about to step forward—the clinic now treats Barnaby like a lucky mascot"
