      - "Fiercely believes in Arthur even when he doubts himself"
    driving_want: "Stop being a physical burden to Arthur and help him catalog the new world."
    core_fear: "Succumbing to her fever and leaving Arthur alone."
    current_location: "St. Jude Central Clinic, Isolation Ward 4"

