# Characters Dossier: The Alchemist of the Fallen Era

characters:
  - id: "char-001"
    name: "Arthur Vance"
    role: "Protagonist / The Alchemist"
    age: 23
    gender: "Male"
    tier: "Mortal (Inoculated) -> Soul-Alchemist"
    personality_traits:
      - "Quietly self-deprecating (genuinely believes he is ordinary or 'no good')"
      - "Obsessively thorough (must understand every detail before taking action)"
      - "Clinical under lethal pressure (treats combat wounds and monsters like anatomical specimens)"
      - "Fiercely protective of Eleanor"
    driving_want: "Synthesize a permanent cure for Eleanor's chronic condition and secure a safe laboratory stronghold."
    core_fear: "Failing his sister and being helpless against brute-force monsters."
    voice_profile:
      sentence_cadence: "Analytical, understated, mildly apologetic in conversation, razor-sharp internal deductions"
      formality_level: 0.7
      verbal_tics:
        - "According to the archival footnotes..."
        - "It's nothing impressive, just basic distillation..."
    current_location: "Grand Municipal Library (Chapter 1)"
    equipped_items:
      - "item-001" # Torn Codex Leaf
      - "item-002" # Field Dissection Scalpel Set

  - id: "char-002"
    name: "Eleanor Vance"
    role: "Protagonist's Younger Sister"
    age: 15
    gender: "Female"
    tier: "Mortal (Latent Sovereign Vessel)"
    personality_traits:
